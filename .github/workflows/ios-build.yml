name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app (device, Release)
        working-directory: ios
        run: |
          xcodebuild \
            -project DNSChangerWidget.xcodeproj \
            -scheme DNSChangerWidget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app bundle
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          zip -r DNSChangerWidget.app.zip DNSChangerWidget.app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: dns-changer-widget-ios-app
          path: ios/build/Build/Products/Release-iphoneos/DNSChangerWidget.app.zip
          retention-days: 2

      # ------------------------------------------------------------------
      # Optional signed build (equivalent of the Android release keystore).
      # It only runs when the IOS_CERTIFICATE_BASE64 secret is configured.
      # Required secrets:
      #   IOS_CERTIFICATE_BASE64        - base64 of a .p12 signing certificate
      #   IOS_CERTIFICATE_PASSWORD      - password of that .p12
      #   IOS_PROVISIONING_PROFILES_BASE64 - base64 tar.gz of the provisioning
      #                                   profiles for all three bundle IDs:
      #                                   com.example.dnschanger,
      #                                   com.example.dnschanger.widget,
      #                                   com.example.dnschanger.dnsproxy
      #                                   (each profile must include the
      #                                   Network Extensions / App Group
      #                                   capabilities)
      #   IOS_TEAM_ID                   - the Apple Developer team ID
      # ------------------------------------------------------------------
      - name: Import signing certificate and provisioning profiles
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
        run: |
          set -e
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/ios_cert.p12
          echo "$PROFILES_BASE64" | base64 --decode > /tmp/profiles.tar.gz
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          tar -xzf /tmp/profiles.tar.gz -C "$HOME/Library/MobileDevice/Provisioning Profiles"
          security create-keychain -p ci ios-build.keychain
          security default-keychain -s ios-build.keychain
          security unlock-keychain -p ci ios-build.keychain
          security import /tmp/ios_cert.p12 -k ios-build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci ios-build.keychain

      - name: Archive and export signed IPA
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        working-directory: ios
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project DNSChangerWidget.xcodeproj \
            -scheme DNSChangerWidget \
            -configuration Release \
            -archivePath build/DNSChangerWidget.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          xcodebuild -exportArchive \
            -archivePath build/DNSChangerWidget.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ipa \
            -allowProvisioningUpdates

      - name: Upload signed IPA
        if: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dns-changer-widget-ios-ipa
          path: ios/ipa/DNSChangerWidget.ipa
          retention-days: 2
