name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build signed release APK
        run: |
          gradle assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.keystore" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="dns-changer" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-changer-widget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-changer-widget-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 2
