name: Create Signing Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Create keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore dns-release.keystore \
            -alias dns-changer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'DNSWidget_2026_Orange42!' \
            -keypass 'DNSWidget_2026_Orange42!' \
            -dname "CN=DNS Changer Widget"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: dns-release-keystore
          path: dns-release.keystore
