name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias dns-changer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=DNS Changer Widget"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: |
          gradle assembleRelease \
            --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password=changeit \
            -Pandroid.injected.signing.key.alias=dns-changer \
            -Pandroid.injected.signing.key.password=changeit

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-toggle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-toggle-release-apk
          path: app/build/outputs/apk/release/app-release.apk
