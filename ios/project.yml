name: DNSChangerWidget
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  DNSChangerWidget:
    type: application
    platform: iOS
    sources:
      - path: DNSChangerWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dnschanger
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: DNSChangerWidget/Info.plist
      properties:
        CFBundleDisplayName: DNS Changer Widget
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: DNSChangerWidget/DNSChangerWidget.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - dns-proxy
        com.apple.security.application-groups:
          - group.com.example.dnschanger
    dependencies:
      - target: DNSChangerWidgetExtension
        embed: true
      - target: DNSProxyExtension
        embed: true

  DNSChangerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DNSChangerWidgetExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dnschanger.widget
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: DNSChangerWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: DNS Changer Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DNSChangerWidgetExtension/DNSChangerWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.dnschanger

  DNSProxyExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DNSProxyExtension
      - path: Shared/DNSChangerShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dnschanger.dnsproxy
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: DNSProxyExtension/Info.plist
      properties:
        CFBundleDisplayName: DNS Proxy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.dns-proxy
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DNSProxyProvider
    entitlements:
      path: DNSProxyExtension/DNSProxyExtension.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - dns-proxy

schemes:
  DNSChangerWidget:
    build:
      targets:
        DNSChangerWidget: all
        DNSChangerWidgetExtension: all
        DNSProxyExtension: all
    run:
      config: Debug
    archive:
      config: Release
